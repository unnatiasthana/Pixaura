<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="post-composer login-container">

        <h2 class="app-title login-title">PIXAURA</h2>

        <div class="profile-tabs login-tabs">
            <label for="toggle-login" class="tab-btn">Login</label>
            <label for="toggle-signup" class="tab-btn">Sign Up</label>
        </div>

        <form class="auth-section login-view">
            <div class="login-input-group">
                <p class="kw-title">Email or Username</p>
                <input type="text" class="search-input" placeholder="Enter your details" required>
            </div>
            <div class="login-input-group-last">
                <p class="kw-title">Password</p>
                <input type="password" class="search-input" placeholder="••••••••" required>
            </div>
            <a href="index.html" class="btn btn--primary login-btn"
                style="text-decoration: none; text-align: center; display: block;">Log In</a>
        </form>



    </div>

</body>

</html>
